# VM (Universal Forwarder) - C:\Program Files\SplunkUniversalForwarder\etc\system\local\outputs.conf
# 192.168.56.1 = host on the VirtualBox Host-only network.
# A bridged adapter over phone-hotspot Wi-Fi kept changing IPs and dropping the
# forwarder, so a fixed Host-only network was added as a second adapter.
[tcpout]
defaultGroup = default-autolb-group

[tcpout:default-autolb-group]
server = 192.168.56.1:9997

[tcpout-server://192.168.56.1:9997]
