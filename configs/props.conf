# Host (Splunk Enterprise) - C:\Program Files\Splunk\etc\system\local\props.conf
# Both exports start every line with an ISO UTC timestamp like 2026-10-25T10:17:15.592Z.
# The trailing Z in TIME_FORMAT is only a literal character, NOT a timezone,
# so TZ = UTC is required. Without it Splunk assumed local time (IST) and
# every event landed 5h30m early.
[winsec_export]
TIME_PREFIX = ^
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3NZ
MAX_TIMESTAMP_LOOKAHEAD = 30
SHOULD_LINEMERGE = false
KV_MODE = auto
TZ = UTC

[sysmon_kv]
TIME_PREFIX = ^
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3NZ
MAX_TIMESTAMP_LOOKAHEAD = 30
SHOULD_LINEMERGE = false
KV_MODE = auto
TZ = UTC
